
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Profile</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js" defer></script>
</head>
<body>
  <main>
    <h1>🎮 Game Profile</h1>
    <p>Create your gaming profile.</p>

    <form id="profileForm">
      <label for="name">Your Name</label>
      <input id="name" required>

      <label for="favorite">Favorite Game</label>
      <select id="favorite" required>
        <option value="">Choose a game</option>
      </select>

      <label for="comment">Comment</label>
      <textarea id="comment" required></textarea>

      <button type="submit">Build My Profile</button>
    </form>

    <section id="result">
      <h2>Your Profile</h2>
      <p>Submit the form to create your profile.</p>
    </section>

    <button id="clearButton" type="button">Clear Session</button>
  </main>
</body>
</html>
